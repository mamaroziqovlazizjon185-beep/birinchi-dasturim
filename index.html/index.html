<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birinchi dasturim</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;font-family:Arial,sans-serif;background:linear-gradient(135deg,#dbeafe,#ede9fe);color:#172554}
.card{max-width:480px;padding:30px 22px;text-align:center;background:white;border-radius:24px;box-shadow:0 12px 32px #0002}
.emoji{font-size:48px}p{line-height:1.7;color:#475569}button{padding:14px 22px;border:0;border-radius:12px;background:#2563eb;color:white;font-size:16px}#message{margin-top:18px;color:#166534;font-weight:bold}
</style>
</head>
<body>
<main class="card">
<div class="emoji">🚀</div>
<h1>Salom, dunyo!</h1>
<p>Bu mening birinchi dasturim. Men Android telefonimda dasturlashni o‘rganyapman.</p>
<button onclick="document.getElementById('message').textContent='Barakalla! Tugmangiz ishladi 🎉'">Meni bosing</button>
<div id="message"></div>
</main>
</body>
</html>
